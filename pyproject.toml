[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-attention-headroom-allocator"
version = "0.1.0"
description = "Dynamic context window headroom allocator dynamically rebalancing prompt, scratchpad, and tool payload quotas"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
prompt-attention-headroom-allocator = "prompt_attention_headroom_allocator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_attention_headroom_allocator*"]
